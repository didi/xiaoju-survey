# Lint
name: Server Lint

on:
  push:
    branches:
      - main
      - develop
      - releases/**
    paths:
      - server/**
      - .github/workflows/**
      - package.json
      - package-lock.json
      - .nvmrc
  pull_request:
    branches:
      - develop
      - main
      - releases/**
      - feature/**
    paths:
      - server/**
      - .github/workflows/**
      - package.json
      - package-lock.json
      - .nvmrc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Pin npm
        run: npm install --global npm@10.9.9

      - name: Install dependencies
        run: cd server && npm ci

      - name: Lint
        run: cd server && npm run lint
